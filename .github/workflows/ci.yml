name: CI

# 每次推 main / 开 PR 都跑 typecheck + 构建 + 全量测试。
# 存在的理由：原来的 CI 只在打 tag 时构建，且不跑 typecheck/test，
# 于是 src/middleware.ts 这类没有任何测试的模块成了问题温床（两个 P0 都出在那里）。
#
# 本分支（Node 后端）不再需要 wrangler / D1 资源 ID / miniflare，
# 测试直接在进程内起真实 HTTP 服务 + node:sqlite 内存库。

on:
  push:
    branches: ["main", "feat/node-backend"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: "verify: typecheck / build / test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.18.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # node:sqlite 需要 Node >= 22；这里钉 24 与本地验证环境一致
          node-version: "24.16.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        # 不指定主题：走默认解析（modern），顺带覆盖默认主题的类型检查
        run: |
          pnpm exec astro sync
          pnpm run typecheck

      # 构建与测试固定用 classic：测试套件里「阅读历史」等期望是按 classic 写的
      # （首页 #history 区块、文章页续读脚本），而默认主题 modern 目前没有这些实现。
      # 也就是「默认主题缺功能」这个结构性缺口不能靠「碰巧跑在哪个主题」掩盖，
      # 因此这里显式钉住，缺口另立任务。（类型检查层面已不再排除任何主题目录。）
      - name: Build
        env:
          BLOG_THEME: classic
        run: pnpm run build

      - name: Test
        # e2e 用例跑 dist 产物（进程内起 HTTP server），因此必须在 Build 之后执行
        env:
          BLOG_THEME: classic
        run: pnpm test
