name: Release

# 打 v* tag 时构建并发布；workflow_dispatch 只构建、不发布（发布 job 限定 tag）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 两套产物分开构建。node 和 cloudflare 都写 dist/，同机连做会互相覆盖，
  # 所以用 BLOG_DIST_OUT 各自落到 dist-node / dist-cloudflare。
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [node, cloudflare]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.18.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          BLOG_TARGET: ${{ matrix.target }}
          BLOG_DIST_OUT: dist-${{ matrix.target }}
          # CI 没有真实 D1 资源 ID；给一个合法占位 UUID，避免 wrangler.jsonc 残留 ${...} 占位符
          BLOG_D1_ID: "00000000-0000-0000-0000-000000000000"
        run: pnpm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist-${{ matrix.target }}
          if-no-files-found: error

  # 产物（node / cloudflare）与平台（四个平台 / 无环境）是两个独立维度，
  # 所以两组都要覆盖：node × {4 平台 + none}、cloudflare × {4 平台 + none}。
  # 自托管用户要平台环境；cloudflare 用户多用于本地构建后再 wrangler 部署，
  # 同样需要能在自己的机器上跑 pnpm，所以也给平台包。
  pack:
    name: pack ${{ matrix.target }}-${{ matrix.platform }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [node, cloudflare]
        platform: [win-x64, linux-x64, macos-arm64, macos-x64, none]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist-${{ matrix.target }}

      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      - name: Assemble portable runtime
        if: matrix.platform != 'none'
        run: node scripts/pack-release.mjs runtime ${{ matrix.platform }}

      - name: Pack
        run: |
          if [[ "${{ matrix.platform }}" == "none" ]]; then
            OUT="blog-${VERSION}-${{ matrix.target }}-without-env.zip"
          else
            OUT="blog-${VERSION}-${{ matrix.target }}-with-env-${{ matrix.platform }}.zip"
          fi
          node scripts/pack-release.mjs pack "${{ matrix.target }}" "${{ matrix.platform }}" "$VERSION" "$OUT" "dist-${{ matrix.target }}"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}-${{ matrix.platform }}
          path: ${{ env.OUT }}
          if-no-files-found: error

  release:
    name: publish release
    needs: pack
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install git-cliff
        # setup-git-cliff 已停止维护（仍停在 Node 20），改用 PyPI 官方包
        run: pipx install git-cliff

      - name: Generate changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 区间显式算，按 tag 类型分流：
          #   正式版（vX.Y.Z）：从「上一个正式版」算起——跳过 alpha/beta/rc 的边界，
          #     不看测试版的人不会漏内容；首个正式版则是整段历史。
          #   预发布版（alpha/beta/rc）：从「上一个任意 tag」算起，保持增量（beta.2 只看 beta.1 之后）。
          # 不用 --current：它只能看最近的 tag，正式版会被算成上一个 rc 的区间。
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PREV_TAG=$(git describe --tags --abbrev=0 --exclude '*-*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          else
            PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          fi
          if [[ -n "$PREV_TAG" ]]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE=""
          fi

          git-cliff --tag "$GITHUB_REF_NAME" $RANGE --strip header --github-repo WhiteMoon319/blog_for_WhiteMoon319 -o RELEASE_NOTES.md || true

          # 兜底：git-cliff 没产出内容时退回 git log（区间同上）
          if [[ ! -s RELEASE_NOTES.md ]]; then
            echo "## 更新内容" > RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            if [[ -z "$PREV_TAG" ]]; then
              git log --pretty=format:"- %s" --reverse >> RELEASE_NOTES.md
            else
              git log "${PREV_TAG}..${GITHUB_REF_NAME}" --pretty=format:"- %s" --reverse >> RELEASE_NOTES.md
            fi
            echo "" >> RELEASE_NOTES.md
          fi

      - name: Append download guide
        run: |
          cat >> RELEASE_NOTES.md << EOF

          ---

          ### 下载哪个包

          包名格式：\`blog-<版本>-<目标>-<环境>.zip\`。

          **目标**决定用途：

          | 目标 | 用于 |
          |---|---|
          | \`node\` | 自托管（自己的机器或 VPS），\`./setup.sh\` 或 \`setup.bat\` 起步 |
          | \`cloudflare\` | 部署到 Cloudflare Workers，\`pnpm cf:deploy\` |

          **环境**决定是否自带便携运行时：

          | 环境 | 说明 |
          |---|---|
          | \`with-env-win-x64\` | Windows，解压后可跑向导，无需自行装 Node/pnpm/git |
          | \`with-env-linux-x64\` | Linux x64，内置 Node 与 pnpm（git 用系统自带的） |
          | \`with-env-macos-arm64\` | macOS Apple Silicon |
          | \`with-env-macos-x64\` | macOS Intel |
          | \`without-env\` | 不含运行时，需自备 Node ≥ 22 与 pnpm |

          两个维度可以自由组合，例如：

          - \`blog-${VERSION}-node-with-env-win-x64.zip\` → Windows 上自托管
          - \`blog-${VERSION}-cloudflare-with-env-macos-arm64.zip\` → Mac 上构建并部署到 Cloudflare
          - \`blog-${VERSION}-cloudflare-without-env.zip\` → 已有 Node 环境，只需产物与源码

          每个包只含**一个目标**的产物，不混装。node 产物里没有 worker 入口，
          cloudflare 产物依赖 workerd 运行时，两者不能互换。
          EOF

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          name: "v${{ env.VERSION }}"
          tag_name: ${{ github.ref_name }}
          files: assets/*.zip
          body_path: RELEASE_NOTES.md