name: Release

# 打 v* tag 时构建并发布；workflow_dispatch 只构建、不发布（发布 job 限定 tag）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 两套产物分开构建。node 和 cloudflare 都写 dist/，同机连做会互相覆盖，
  # 所以用 BLOG_DIST_OUT 各自落到 dist-node / dist-cloudflare。
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [node, cloudflare]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.18.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          BLOG_TARGET: ${{ matrix.target }}
          BLOG_DIST_OUT: dist-${{ matrix.target }}
          # CI 没有真实 D1 资源 ID；给一个合法占位 UUID，避免 wrangler.jsonc 残留 ${...} 占位符
          BLOG_D1_ID: "00000000-0000-0000-0000-000000000000"
        run: pnpm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist-${{ matrix.target }}
          if-no-files-found: error

  pack:
    name: pack ${{ matrix.package }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 自托管：带便携运行环境，产物取 node 那套
          - package: win-x64
            runtime: win-x64
            target: node
          - package: linux-x64
            runtime: linux-x64
            target: node
          - package: macos-arm64
            runtime: macos-arm64
            target: node
          - package: macos-x64
            runtime: macos-x64
            target: node
          # 自托管、自备环境：同样取 node 产物
          - package: plain
            runtime: ""
            target: node
          # Cloudflare 部署包：不带运行环境，产物取 cloudflare 那套
          - package: cloudflare
            runtime: ""
            target: cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist-${{ matrix.target }}

      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      - name: Assemble portable runtime
        if: matrix.runtime != ''
        run: node scripts/pack-release.mjs runtime ${{ matrix.runtime }}

      - name: Pack
        run: |
          if [[ "${{ matrix.package }}" == "plain" ]]; then
            OUT="blog-${VERSION}-without-env.zip"
          elif [[ "${{ matrix.package }}" == "cloudflare" ]]; then
            OUT="blog-${VERSION}-cloudflare.zip"
          else
            OUT="blog-${VERSION}-with-env-${{ matrix.package }}.zip"
          fi
          node scripts/pack-release.mjs pack "${{ matrix.package }}" "$VERSION" "$OUT" "dist-${{ matrix.target }}"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.package }}
          path: ${{ env.OUT }}
          if-no-files-found: error

  release:
    name: publish release
    needs: pack
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install git-cliff
        # setup-git-cliff 已停止维护（仍停在 Node 20），改用 PyPI 官方包
        run: pipx install git-cliff

      - name: Generate changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 区间显式算，按 tag 类型分流：
          #   正式版（vX.Y.Z）：从「上一个正式版」算起——跳过 alpha/beta/rc 的边界，
          #     不看测试版的人不会漏内容；首个正式版则是整段历史。
          #   预发布版（alpha/beta/rc）：从「上一个任意 tag」算起，保持增量（beta.2 只看 beta.1 之后）。
          # 不用 --current：它只能看最近的 tag，正式版会被算成上一个 rc 的区间。
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PREV_TAG=$(git describe --tags --abbrev=0 --exclude '*-*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          else
            PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          fi
          if [[ -n "$PREV_TAG" ]]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE=""
          fi

          git-cliff --tag "$GITHUB_REF_NAME" $RANGE --strip header --github-repo WhiteMoon319/blog_for_WhiteMoon319 -o RELEASE_NOTES.md || true

          # 兜底：git-cliff 没产出内容时退回 git log（区间同上）
          if [[ ! -s RELEASE_NOTES.md ]]; then
            echo "## 更新内容" > RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            if [[ -z "$PREV_TAG" ]]; then
              git log --pretty=format:"- %s" --reverse >> RELEASE_NOTES.md
            else
              git log "${PREV_TAG}..${GITHUB_REF_NAME}" --pretty=format:"- %s" --reverse >> RELEASE_NOTES.md
            fi
            echo "" >> RELEASE_NOTES.md
          fi

      - name: Append download guide
        run: |
          cat >> RELEASE_NOTES.md << EOF

          ---

          ### 下载哪个包

          | 包 | 适用 |
          |---|---|
          | \`blog-${VERSION}-with-env-win-x64.zip\` | **Windows 自托管**：解压后双击 \`setup.bat\`，无需自行装 Node/pnpm/git |
          | \`blog-${VERSION}-with-env-linux-x64.zip\` | **Linux x64 自托管**：解压后 \`./setup.sh\`，内置 Node 与 pnpm（git 用系统自带的） |
          | \`blog-${VERSION}-with-env-macos-arm64.zip\` | **macOS（Apple Silicon）自托管**：解压后 \`./setup.sh\` |
          | \`blog-${VERSION}-with-env-macos-x64.zip\` | **macOS（Intel）自托管**：解压后 \`./setup.sh\` |
          | \`blog-${VERSION}-without-env.zip\` | 自托管，但已自备 Node ≥ 22 与 pnpm |
          | \`blog-${VERSION}-cloudflare.zip\` | **部署到 Cloudflare**：含 cloudflare 产物与 \`wrangler.jsonc\`，\`pnpm cf:deploy\` 上线 |

          \`with-env\` 包自带便携运行环境（Node + pnpm，Windows 另含 MinGit），开箱即用。

          每个包都只含**一个目标**的产物：自托管包内是 node 产物，cloudflare 包内是
          cloudflare 产物。两者不能混用——node 产物里没有 worker 入口，cloudflare 产物
          依赖 workerd 运行时。部署向导会按你选的路径用对应目标重新构建一次。
          EOF

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          name: "v${{ env.VERSION }}"
          tag_name: ${{ github.ref_name }}
          files: assets/*.zip
          body_path: RELEASE_NOTES.md
